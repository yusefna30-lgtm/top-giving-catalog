<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتالوج المنتجات</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f9f9f9; margin: 0; padding: 20px; color: #333; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #222; margin-bottom: 5px; }
        .header p { color: #666; font-size: 14px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; max-width: 1000px; margin: auto; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* تصميم معرض الصور */
        .slider-container { position: relative; width: 100%; height: 380px; background-color: #fff; overflow: hidden; }
        .slide { display: none; width: 100%; height: 100%; object-fit: contain; }
        .slide.active { display: block; }
        
        /* أزرار التنقل يمين ويسار */
        .prev, .next { position: absolute; top: 50%; transform: translateY(-50%); background-color: rgba(0,0,0,0.5); color: white; border: none; padding: 10px 15px; cursor: pointer; font-size: 18px; border-radius: 50%; transition: 0.2s; }
        .prev:hover, .next:hover { background-color: rgba(0,0,0,0.8); }
        .prev { right: 10px; }
        .next { left: 10px; }

        .card-content { padding: 15px; text-align: right; }
        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; color: #111; }
        .card-price { color: #2e7d32; font-weight: bold; font-size: 16px; margin-bottom: 12px; }
        .btn { display: block; text-align: center; background-color: #25d366; color: white; padding: 12px; text-decoration: none; border-radius: 0 0 12px 12px; font-weight: bold; font-size: 15px; }
        .btn:hover { background-color: #20ba5a; }
    </style>
</head>
<body>

    <div class="header">
        <h1>متجرنا الرقمي</h1>
        <p>تصفح منتجاتنا واطلبها مباشرة عبر واتساب</p>
    </div>

    <div class="grid">
        <!-- المنتج مع صور متعددة -->
        <div class="card">
            <div class="slider-container">
                <!-- الصورة الأولى (الأمامية) -->
                <img src="0051.png" class="slide active" alt="الوجه الأمامي">
                <!-- الصورة الثانية (الخلفية) -->
                <img src="new tshirt 01.png" class="slide" alt="الوجه الخلفي">
                
                <!-- أزرار التنقل -->
                <button class="prev" onclick="changeSlide(1)">&#10095;</button>
                <button class="next" onclick="changeSlide(-1)">&#10094;</button>
            </div>

            <div class="card-content">
                <div class="card-title">تيشيرت رجالي أوفر سايز</div>
                <div class="card-price">85 ريال</div>
            </div>
            <a href="https://wa.me/966560564719?text=أريد%20طلب%20تيشيرت%20رجالي%20أوفر%20سايز" class="btn">اطلب عبر واتساب</a>
        </div>
    </div>

    <script>
        let currentSlide = 0;
        function changeSlide(direction) {
            const slides = document.querySelectorAll('.slide');
            currentSlide += direction;
            if (currentSlide >= slides.length) { currentSlide = 0; }
            if (currentSlide < 0) { currentSlide = slides.length - 1; }
            slides.forEach((slide, index) => {
                slide.classList.remove('active');
                if (index === currentSlide) { slide.classList.add('active'); }
            });
        }
    </script>

</body>
</html>
