<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتالوج المنتجات</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f9f9f9; margin: 0; padding: 20px; color: #333; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #222; margin-bottom: 5px; }
        .header p { color: #666; font-size: 14px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1000px; margin: auto; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 350px; object-fit: contain; /* تم تغييرها لتناسب الصورة المدمجة */ background-color: #fff; }
        .card-content { padding: 15px; text-align: right; }
        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; color: #111; }
        .card-price { color: #2e7d32; font-weight: bold; font-size: 16px; margin-bottom: 12px; }
        .btn { display: block; text-align: center; background-color: #25d366; color: white; padding: 12px; text-decoration: none; border-radius: 0 0 12px 12px; font-weight: bold; font-size: 15px; }
        .btn:hover { background-color: #20ba5a; }
        .card-note { font-size: 12px; color: #888; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>متجرنا الرقمي</h1>
        <p>تصفح منتجاتنا واطلبها مباشرة عبر واتساب</p>
    </div>

    <div class="grid">
        <!-- المنتج الأول (الصورة المدمجة) -->
        <div class="card">
            <img src="0051.png" alt="تيشيرت رجالي أوفر سايز (أمام وخلف)">
            <div class="card-content">
                <div class="card-title">تيشيرت رجالي أوفر سايز</div>
                <div class="card-note">صورة أمامية وخلفية للمنتج</div>
                <div class="card-price">85 ريال</div>
            </div>
            <a href="https://wa.me/966560564719?text=أريد%20طلب%20تيشيرت%20رجالي%20أوفر%20سايز%20المعروض%20بالصورة" class="btn">اطلب عبر واتساب</a>
        </div>
    </div>

</body>
</html>
