<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتالوج المنتجات - Top Giving</title>
    <style>
        /* الثيم الفاخر المستوحى من تصميمك */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0b0b0b; /* خلفية داكنة فخمة */
            margin: 0; 
            padding: 20px; 
            color: #f1f1f1; 
        }
        
        .header { text-align: center; margin-bottom: 25px; }
        .logo-container { width: 120px; height: 120px; margin: 0 auto 12px auto; border-radius: 50%; overflow: hidden; box-shadow: 0 4px 15px rgba(212,175,55,0.3); border: 2px solid #d4af37; background-color: #1a1a1a; display: flex; align-items: center; justify-content: center; }
        .header img.logo { width: 100%; height: 100%; object-fit: cover; }
        .logo-fallback { font-size: 30px; font-weight: bold; color: #d4af37; letter-spacing: 2px; display: none; }
        
        .header h1 { color: #ffffff; margin: 0 0 5px 0; font-size: 24px; letter-spacing: 1.5px; font-weight: 700; }
        .header p { color: #aaa; font-size: 13px; margin: 0; letter-spacing: 0.5px; }

        /* حاوية فيديو تيك توك مدمجة ومرتبة بالثيم الداكن */
        .tiktok-section { 
            max-width: 320px; 
            height: 340px; 
            margin: 0 auto 30px auto; 
            text-align: center; 
            background: #141414; 
            padding: 8px; 
            border-radius: 16px; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.6); 
            border: 1px solid #333;
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tiktok-section blockquote {
            transform: scale(0.80);
            transform-origin: center;
            margin: 0 auto !important;
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 950px; margin: auto; }
        
        /* بطاقات المنتجات بالثيم الداكن الفاخر */
        .card { background: #161616; border: 1px solid #262626; border-radius: 14px; box-shadow: 0 6px 15px rgba(0,0,0,0.4); overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; }
        .card:hover { border-color: #d4af37; }
        
        .slider-container { position: relative; width: 100%; height: 350px; background-color: #111; overflow: hidden; }
        .slide { display: none; width: 100%; height: 100%; object-fit: contain; }
        .slide.active { display: block; }
        
        .slide-counter { position: absolute; top: 10px; left: 10px; background-color: rgba(0,0,0,0.7); color: #fff; padding: 3px 8px; font-size: 11px; border-radius: 20px; z-index: 10; border: 1px solid #444; }

        .prev, .next { position: absolute; top: 50%; transform: translateY(-50%); background-color: rgba(0,0,0,0.6); color: white; border: none; padding: 8px 12px; cursor: pointer; font-size: 16px; border-radius: 50%; transition: 0.2s; z-index: 10; }
        .prev:hover, .next:hover { background-color: #d4af37; color: #000; }
        .prev { right: 10px; }
        .next { left: 10px; }

        .card-content { padding: 16px; text-align: right; }
        .card-title { font-size: 17px; font-weight: bold; margin-bottom: 8px; color: #fff; }
        .card-price { color: #4cd137; font-weight: bold; font-size: 16px; margin-bottom: 12px; }
        
        .color-selector { margin-bottom: 12px; }
        .color-selector label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #bbb; }
        .color-options { display: flex; gap: 10px; }
        .color-btn { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #444; cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
        .color-btn:hover { transform: scale(1.1); }
        .color-btn.selected { border-color: #d4af37; transform: scale(1.1); box-shadow: 0 0 8px rgba(212,175,55,0.6); }

        .size-selector { margin-bottom: 15px; }
        .size-selector label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #bbb; }
        .size-selector select { width: 100%; padding: 10px; border: 1px solid #333; border-radius: 6px; font-size: 14px; background-color: #222; color: #fff; cursor: pointer; }

        .btn { display: block; text-align: center; background-color: #25d366; color: white; padding: 12px; text-decoration: none; border-radius: 0 0 14px 14px; font-weight: bold; font-size: 15px; transition: 0.2s; }
        .btn:hover { background-color: #20ba5a; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-container">
            <img src="logo.png" alt="شعار المتجر" class="logo" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='block';">
            <span id="fallback-logo" class="logo-fallback">TG</span>
        </div>
        <h1>TOP GIVING</h1>
        <p>تصفح منتجاتنا واطلبها مباشرة عبر واتساب</p>
    </div>

    <div class="tiktok-section">
        <blockquote class="tiktok-embed" cite="https://www.tiktok.com/@topgivingsa/video/7668357906089200916" data-video-id="7668357906089200916" style="max-width: 320px; min-width: 270px;" >
            <section> </section>
        </blockquote>
        <script async src="https://www.tiktok.com/embed.js"></script>
    </div>

    <div class="grid">
        
        <div class="card">
            <div class="slider-container" id="slider-1">
                <div class="slide-counter"><span class="current-num">1</span> / <span class="total-num">2</span></div>
                <img src="0051.png" class="slide active" alt="الوجه الأمامي">
                <img src="new tshirt 01.png" class="slide" alt="الوجه الخلفي">
                <button class="prev" onclick="changeSlide(1, -1)">&#10095;</button>
                <button class="next" onclick="changeSlide(1, 1)">&#10094;</button>
            </div>

            <div class="card-content">
                <div class="card-title">تيشيرت رجالي أوفر سايز</div>
                <div class="card-price">85 ريال</div>

                <div class="color-selector">
                    <label>اختر اللون:</label>
                    <div class="color-options" id="colors-1">
                        <button class="color-btn selected" style="background-color: #ffffff;" onclick="selectColor(1, 0, 'أبيض', this)" title="أبيض"></button>
                        <button class="color-btn" style="background-color: #111111;" onclick="selectColor(1, 1, 'أسود', this)" title="أسود"></button>
                    </div>
                </div>
                
                <div class="size-selector">
                    <label for="size-1">اختر المقاس:</label>
                    <select id="size-1">
                        <option value="S">S</option>
                        <option value="M">M</option>
                        <option value="L" selected>L</option>
                        <option value="XL">XL</option>
                        <option value="XXL">XXL</option>
                    </select>
                </div>
            </div>

            <a href="#" class="btn" onclick="sendOrder(event, 'تيشيرت رجالي أوفر سايز (الأول)', '85 ريال', 1, 'size-1')">اطلب عبر واتساب</a>
        </div>

        <div class="card">
            <div class="slider-container" id="slider-2">
                <div class="slide-counter"><span class="current-num">1</span> / <span class="total-num">3</span></div>
                <img src="Tshirt001.png" class="slide active" alt="أسود">
                <img src="Tshirt002.png" class="slide" alt="رمادي">
                <img src="Tshirt003.png" class="slide" alt="بيج">
                
                <button class="prev" onclick="changeSlide(2, -1)">&#10095;</button>
                <button class="next" onclick="changeSlide(2, 1)">&#10094;</button>
            </div>

            <div class="card-content">
                <div class="card-title">تيشيرت رجالي أوفر سايز (Brave)</div>
                <div class="card-price">69 ريال</div>

                <div class="color-selector">
                    <label>اختر اللون:</label>
                    <div class="color-options" id="colors-2">
                        <button class="color-btn selected" style="background-color: #1a1a1a;" onclick="selectColor(2, 0, 'أسود', this)" title="أسود"></button>
                        <button class="color-btn" style="background-color: #B5B9BC;" onclick="selectColor(2, 1, 'رمادي', this)" title="رمادي"></button>
                        <button class="color-btn" style="background-color: #C4B29E;" onclick="selectColor(2, 2, 'بيج', this)" title="بيج"></button>
                    </div>
                </div>
                
                <div class="size-selector">
                    <label for="size-2">اختر المقاس:</label>
                    <select id="size-2">
                        <option value="M">M</option>
                        <option value="L" selected>L</option>
                        <option value="XL">XL</option>
                        <option value="2XL">2XL</option>
                    </select>
                </div>
            </div>

            <a href="#" class="btn" onclick="sendOrder(event, 'تيشيرت رجالي أوفر سايز (Brave)', '69 ريال', 2, 'size-2')">اطلب عبر واتساب</a>
        </div>

    </div>

    <script>
        const currentSlides = { 1: 0, 2: 0 };
        const selectedCardColors = { 1: 'أبيض', 2: 'أسود' };

        window.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.slider-container').forEach((slider, index) => {
                const sliderId = index + 1;
                const slides = slider.querySelectorAll('.slide');
                slider.querySelector('.total-num').innerText = slides.length;
            });
        });

        function showSlide(sliderId, index) {
            const slider = document.getElementById(`slider-${sliderId}`);
            const slides = slider.querySelectorAll('.slide');
            slides[currentSlides[sliderId]].classList.remove('active');
            
            currentSlides[sliderId] = index;
            if (currentSlides[sliderId] >= slides.length) currentSlides[sliderId] = 0;
            if (currentSlides[sliderId] < 0) currentSlides[sliderId] = slides.length - 1;
            
            slides[currentSlides[sliderId]].classList.add('active');
            slider.querySelector('.current-num').innerText = currentSlides[sliderId] + 1;
        }

        function changeSlide(sliderId, direction) {
            showSlide(sliderId, currentSlides[sliderId] + direction);
        }

        function selectColor(sliderId, slideIndex, colorName, buttonElement) {
            showSlide(sliderId, slideIndex);
            selectedCardColors[sliderId] = colorName;
            
            const colorContainer = document.getElementById(`colors-${sliderId}`);
            colorContainer.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('selected'));
            buttonElement.classList.add('selected');
        }

        let phone = "966560564719";
        function sendOrder(event, productName, price, sliderId, sizeElementId) {
            event.preventDefault();
            const sizeSelect = document.getElementById(sizeElementId);
            const selectedSize = sizeSelect.value;
            const selectedColor = selectedCardColors[sliderId];

            const message = `أريد طلب ${productName}\n- اللون: ${selectedColor}\n- المقاس: ${selectedSize}\n- السعر: ${price}`;
            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${phone}?text=${encodedMessage}`, '_blank');
        }
    </script>

</body>
</html>
