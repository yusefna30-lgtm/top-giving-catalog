<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتالوج المنتجات - Top Giving</title>
    <style>
        /* الثيم الداكن الفاخر */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0b0b0b; 
            margin: 0; 
            padding: 10px; 
            color: #f1f1f1; 
            padding-bottom: 90px; /* مساحة لشريط السلة العائم أسفل الشاشة */
        }
        
        .header { text-align: center; margin-bottom: 12px; }
        .logo-container { width: 80px; height: 80px; margin: 0 auto 6px auto; border-radius: 50%; overflow: hidden; box-shadow: 0 3px 10px rgba(212,175,55,0.3); border: 2px solid #d4af37; background-color: #1a1a1a; display: flex; align-items: center; justify-content: center; }
        .header img.logo { width: 100%; height: 100%; object-fit: cover; }
        .logo-fallback { font-size: 22px; font-weight: bold; color: #d4af37; letter-spacing: 2px; display: none; }
        
        .header h1 { color: #ffffff; margin: 0 0 2px 0; font-size: 18px; letter-spacing: 1px; font-weight: 700; }
        .header p { color: #999; font-size: 11px; margin: 0; }

        /* شبكة المنتجات: منتجان في كل صف وبحجم مرتب */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 10px; 
            max-width: 600px; 
            margin: auto; 
        }
        
        /* بطاقة المنتج مع تأثير الهالة التي تحيط بالكارت بالكامل عند اللمس */
        .card { 
            background: #151515; 
            border: 1px solid #222; 
            border-radius: 10px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.4); 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            transition: all 0.35s ease; 
        }
        
        .card:hover { 
            border-color: #d4af37; 
            box-shadow: 0 0 18px 4px rgba(212, 175, 55, 0.6);
            transform: translateY(-2px);
        }
        
        /* إطار الصورة الصغير والمنسق */
        .slider-container { 
            position: relative; 
            width: 100%; 
            height: 150px; 
            background-color: #111; 
            overflow: hidden; 
        }

        .slide { display: none; width: 100%; height: 100%; object-fit: contain; }
        .slide.active { display: block; }
        
        .slide-counter { position: absolute; top: 4px; left: 4px; background-color: rgba(0,0,0,0.7); color: #fff; padding: 1px 4px; font-size: 8px; border-radius: 10px; z-index: 10; border: 1px solid #444; }

        .prev, .next { position: absolute; top: 50%; transform: translateY(-50%); background-color: rgba(0,0,0,0.6); color: white; border: none; padding: 3px 6px; cursor: pointer; font-size: 11px; border-radius: 50%; transition: 0.2s; z-index: 10; }
        .prev:hover, .next:hover { background-color: #d4af37; color: #000; }
        .prev { right: 4px; }
        .next { left: 4px; }

        .card-content { padding: 8px; text-align: right; }
        .card-title { font-size: 12px; font-weight: bold; margin-bottom: 3px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-price { color: #00e5ff; font-weight: bold; font-size: 12px; margin-bottom: 6px; }
        
        .color-selector { margin-bottom: 6px; }
        .color-selector label { display: block; font-size: 10px; font-weight: bold; margin-bottom: 2px; color: #aaa; }
        .color-options { display: flex; gap: 5px; }
        .color-btn { width: 16px; height: 16px; border-radius: 50%; border: 1px solid #444; cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
        .color-btn:hover { transform: scale(1.1); }
        .color-btn.selected { border-color: #00e5ff; transform: scale(1.1); box-shadow: 0 0 4px rgba(0,229,255,0.6); }

        .size-selector { margin-bottom: 8px; }
        .size-selector label { display: block; font-size: 10px; font-weight: bold; margin-bottom: 2px; color: #aaa; }
        .size-selector select { width: 100%; padding: 4px; border: 1px solid #333; border-radius: 4px; font-size: 11px; background-color: #222; color: #fff; cursor: pointer; }

        /* زر أضف إلى السلة داخل الكارت */
        .add-btn { display: block; text-align: center; background-color: #00bcd4; color: #000; padding: 6px; border: none; width: 100%; cursor: pointer; border-radius: 0 0 10px 10px; font-weight: bold; font-size: 11px; transition: 0.2s; }
        .add-btn:hover { background-color: #00acc1; color: #fff; }

        /* شريط سلة المشتريات العائم أسفل الشاشة */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(18, 18, 18, 0.95);
            border-top: 2px solid #d4af37;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.8);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .cart-info { font-size: 13px; color: #fff; font-weight: bold; }
        .cart-actions { display: flex; gap: 8px; }
        
        .empty-cart-btn { background-color: #d32f2f; color: white; border: none; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .empty-cart-btn:hover { background-color: #b71c1c; }

        .send-cart-btn { background-color: #25d366; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .send-cart-btn:hover { background-color: #20ba5a; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-container">
            <img src="logo.png" alt="شعار المتجر" class="logo" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='block';">
            <span id="fallback-logo" class="logo-fallback">TG</span>
        </div>
        <h1>TOP GIVING</h1>
        <p>تصفح منتجاتنا وأضفها للسلة ثم اطلب عبر واتساب</p>
    </div>

    <div class="grid">
        
        <!-- المنتج الأول -->
        <div class="card">
            <div class="slider-container" id="slider-1">
                <div class="slide-counter"><span class="current-num">1</span> / <span class="total-num">2</span></div>
                <img src="0051.png" class="slide active" alt="الوجه الأمامي">
                <img src="new tshirt 01.png" class="slide" alt="الوجه الخلفي">
                <button class="prev" onclick="changeSlide(1, -1)">&#10095;</button>
                <button class="next" onclick="changeSlide(1, 1)">&#10094;</button>
            </div>

            <div class="card-content">
                <div class="card-title">تيشيرت رجالي أوفر سايز</div>
                <div class="card-price" id="price-1">85 ر.س</div>

                <div class="color-selector">
                    <label>اللون:</label>
                    <div class="color-options" id="colors-1">
                        <button class="color-btn selected" style="background-color: #ffffff;" onclick="selectColor(1, 0, 'أبيض', this)" title="أبيض"></button>
                        <button class="color-btn" style="background-color: #111111;" onclick="selectColor(1, 1, 'أسود', this)" title="أسود"></button>
                    </div>
                </div>
                
                <div class="size-selector">
                    <label for="size-1">المقاس:</label>
                    <select id="size-1">
                        <option value="S">S</option>
                        <option value="M">M</option>
                        <option value="L" selected>L</option>
                        <option value="XL">XL</option>
                        <option value="XXL">XXL</option>
                    </select>
                </div>
            </div>

            <button class="add-btn" onclick="addToCart('تيشيرت رجالي أوفر سايز', 85, 1, 'size-1')">أضف إلى السلة</button>
        </div>

        <!-- المنتج الثاني (Brave) -->
        <div class="card">
            <div class="slider-container" id="slider-2">
                <div class="slide-counter"><span class="current-num">1</span> / <span class="total-num">3</span></div>
                <img src="Tshirt001.png" class="slide active" alt="أسود">
                <img src="Tshirt002.png" class="slide" alt="رمادي">
                <img src="Tshirt003.png" class="slide" alt="بيج">
                
                <button class="prev" onclick="changeSlide(2, -1)">&#10095;</button>
                <button class="next" onclick="changeSlide(2, 1)">&#10094;</button>
            </div>

            <div class="card-content">
                <div class="card-title">PERSIST - Brave</div>
                <div class="card-price" id="price-2">69 ر.س</div>

                <div class="color-selector">
                    <label>اللون:</label>
                    <div class="color-options" id="colors-2">
                        <button class="color-btn selected" style="background-color: #1a1a1a;" onclick="selectColor(2, 0, 'أسود', this)" title="أسود"></button>
                        <button class="color-btn" style="background-color: #B5B9BC;" onclick="selectColor(2, 1, 'رمادي', this)" title="رمادي"></button>
                        <button class="color-btn" style="background-color: #C4B29E;" onclick="selectColor(2, 2, 'بيج', this)" title="بيج"></button>
                    </div>
                </div>
                
                <div class="size-selector">
                    <label for="size-2">المقاس:</label>
                    <select id="size-2">
                        <option value="M">M</option>
                        <option value="L" selected>L</option>
                        <option value="XL">XL</option>
                        <option value="2XL">2XL</option>
                    </select>
                </div>
            </div>

            <button class="add-btn" onclick="addToCart('PERSIST - Brave', 69, 2, 'size-2')">أضف إلى السلة</button>
        </div>

    </div>

    <!-- شريط سلة المشتريات العائم -->
    <div class="cart-bar" id="cartBar">
        <div class="cart-info" id="cartInfo">السلة فارغة (0 منتجات)</div>
        <div class="cart-actions">
            <button class="empty-cart-btn" onclick="clearCart()">إفراغ السلة</button>
            <button class="send-cart-btn" onclick="sendCartOrder()">إرسال الطلب (واتساب)</button>
        </div>
    </div>

    <script>
        const currentSlides = { 1: 0, 2: 0 };
        const selectedCardColors = { 1: 'أبيض', 2: 'أسود' };
        let cart = [];

        window.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.slider-container').forEach((slider, index) => {
                const sliderId = index + 1;
                const slides = slider.querySelectorAll('.slide');
                slider.querySelector('.total-num').innerText = slides.length;
            });
            updateCartBar();
        });

        function showSlide(sliderId, index) {
            const slider = document.getElementById(`slider-${sliderId}`);
            const slides = slider.querySelectorAll('.slide');
            slides[currentSlides[sliderId]].classList.remove('active');
            
            currentSlides[sliderId] = index;
            if (currentSlides[sliderId] >= slides.length) currentSlides[sliderId] = 0;
            if (currentSlides[sliderId] < 0) currentSlides[sliderId] = slides.length - 1;
            
            slides[currentSlides[sliderId]].classList.add('active');
            slider.querySelector('.current-num').innerText = currentSlides[sliderId] + 1;
        }

        function changeSlide(sliderId, direction) {
            showSlide(sliderId, currentSlides[sliderId] + direction);
        }

        function selectColor(sliderId, slideIndex, colorName, buttonElement) {
            showSlide(sliderId, slideIndex);
            selectedCardColors[sliderId] = colorName;
            
            const colorContainer = document.getElementById(`colors-${sliderId}`);
            colorContainer.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('selected'));
            buttonElement.classList.add('selected');
        }

        /* وظائف سلة المشتريات */
        function addToCart(productName, price, sliderId, sizeElementId) {
            const sizeSelect = document.getElementById(sizeElementId);
            const selectedSize = sizeSelect.value;
            const selectedColor = selectedCardColors[sliderId];

            cart.push({
                name: productName,
                price: price,
                color: selectedColor,
                size: selectedSize
            });

            updateCartBar();
            
            // تأثير بصري بسيط عند الإضافة
            alert(`تمت إضافة "${productName}" (اللون: ${selectedColor}، المقاس: ${selectedSize}) إلى السلة بنجاح!`);
        }

        function clearCart() {
            cart = [];
            updateCartBar();
        }

        function updateCartBar() {
            const cartInfo = document.getElementById('cartInfo');
            let totalItems = cart.length;
            let totalPrice = cart.reduce((sum, item) => sum + item.price, 0);

            if (totalItems === 0) {
                cartInfo.innerText = "السلة فارغة (0 منتجات)";
            } else {
                cartInfo.innerText = `السلة: ${totalItems} منتج | الإجمالي: ${totalPrice} ر.س`;
            }
        }

        let phone = "966560564719";
        function sendCartOrder() {
            if (cart.length === 0) {
                alert("السلة فارغة! الرجاء إضافة منتج واحد على الأقل قبل الإرسال.");
                return;
            }

            let message = "مرحباً، أود طلب المنتجات التالية:\n\n";
            cart.forEach((item, index) => {
                message += `${index + 1}. ${item.name}\n   - اللون: ${item.color}\n   - المقاس: ${item.size}\n   - السعر: ${item.price} ر.س\n\n`;
            });

            let totalPrice = cart.reduce((sum, item) => sum + item.price, 0);
            message += `الإجمالي الكلي: ${totalPrice} ر.س`;

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${phone}?text=${encodedMessage}`, '_blank');
        }
    </script>

</body>
</html>
